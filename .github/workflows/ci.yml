# CI: chạy cho mọi PR và mỗi lần push lên main.
# PR chỉ nên gộp khi cả 2 job xanh.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile — dữ liệu, typecheck, expo-doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Kiểm tra dữ liệu thủ tục (JSON)
        run: npm run check:data
      - name: Typecheck
        run: npx tsc --noEmit
      - name: expo-doctor (thư viện khớp SDK)
        run: npx expo-doctor
      - name: Đóng gói thử bundle Android (bắt lỗi import/JSX trước khi build APK)
        run: npx expo export --platform android --output-dir /tmp/export

  server:
    name: Server — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
